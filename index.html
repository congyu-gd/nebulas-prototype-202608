<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nebulas — Workspace</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/layout.css">
</head>
<body>

<!-- ============================================================ app shell
     rail · sidebar · chat · results · app panel · app rail, with a status strip
     spanning all six. Rail buttons, sidebar rows, chat content, the results
     column, the app panel and the app rail are all rendered by app.js — adding
     a section is one entry in the SECTIONS registry.
============================================================================ -->
<div class="app" id="app" data-list="open" data-art="open" data-apps="open" data-sheet="closed">

  <nav class="rail" id="rail" aria-label="Sections">
    <div class="rail__mark" aria-hidden="true"><svg viewBox="0 0 22.91 18.70" fill="none"><path transform="translate(3.04 2.83)" d="M0 9.42169C0 4.21824 4.29139 0 9.58509 0L10.6919 0L11.7988 0C16.2579 0 19.8727 3.55315 19.8727 7.93617C19.8727 12.3192 16.2579 15.8723 11.7988 15.8723L0 15.8723L0 9.42169Z" fill="#ffe082"/><path transform="translate(9.81 6.17)" d="M1.52563 2.98039C2.36821 2.98039 3.05125 2.31321 3.05125 1.4902C3.05125 0.667183 2.36821 0 1.52563 0C0.683046 0 0 0.667183 0 1.4902C0 2.31321 0.683046 2.98039 1.52563 2.98039Z" fill="#2b282f"/><path transform="translate(15.60 6.17)" d="M1.52563 2.98039C2.36821 2.98039 3.05125 2.31321 3.05125 1.4902C3.05125 0.667183 2.36821 0 1.52563 0C0.683046 0 0 0.667183 0 1.4902C0 2.31321 0.683046 2.98039 1.52563 2.98039Z" fill="#2b282f"/><path fill-rule="evenodd" d="M10.8518 0.000919868C10.8995 0.00030702 10.9472 0 10.995 0L13.2624 0C14.9183 0.0256323 16.4786 0.454035 17.8386 1.19024C20.407 2.61801 22.3378 5.2016 22.7257 8.2297C22.7711 8.59739 22.7946 8.97186 22.7946 9.35191C22.7946 14.2796 18.8658 18.2696 13.9269 18.6718C13.6709 18.6917 13.4128 18.702 13.1532 18.702L0.37994 18.702L0 18.702L0 16.4697L0 10.9079C0.057969 7.09158 1.82929 4.04899 4.40095 2.1571C6.20573 0.841216 8.43835 0.0471854 10.8518 0.000919868ZM2.28844 10.6842C2.28844 6.01734 6.22246 2.23408 11.0753 2.23408L13.1046 2.23408C17.1923 2.23408 20.5061 5.42083 20.5061 9.35191C20.5061 13.283 17.1923 16.4697 13.1046 16.4697L4.57688 16.4697L2.28844 16.4697L2.28844 14.2344L2.28844 10.6842Z" fill="currentColor"/></svg></div>
    <!-- section buttons and the account button are injected by app.js -->
  </nav>

  <aside class="listcol" aria-label="Sidebar">
    <div class="listcol__head">
      <span class="listcol__ico" id="listIco" aria-hidden="true"></span>
      <span class="listcol__title" id="listTitle">Chat / Task</span>
      <button class="iconbtn iconbtn--sm tip tip--below" id="searchBtn" data-tip="Search  ⌘K" aria-label="Search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
    </div>
    <div class="listcol__body" id="listBody"></div>
  </aside>

  <!-- ======================================================== chat pane -->
  <section class="pane chatpane" aria-label="Conversation">
    <header class="topbar">
      <h1 class="topbar__title" id="mainTitle">Q3 revenue analysis</h1>
      <span class="topbar__sub" id="mainSub"></span>
      <button class="iconbtn iconbtn--sm" id="mainMore" aria-label="More actions">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h.01M12 12h.01M18 12h.01"/></svg>
      </button>
      <div class="topbar__spacer"></div>
      <!-- Two toggles, not three: the sidebar is reached by ⌘\ and the palette.
           A column you are looking at does not need a button to say so. -->
      <button class="iconbtn tip tip--below" id="artBtn" aria-pressed="true" data-tip="Results  ⌘." aria-label="Toggle results column">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M15 4.5v15"/></svg>
      </button>
      <!-- The app rail is permanent, so there is nothing to toggle. This opens
           the panel beside it on the app you had last. -->
      <button class="iconbtn tip tip--below" id="appsBtn" aria-pressed="false" data-tip="App panel  ⌘]" aria-label="Toggle app panel">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="2.6"/><circle cx="17" cy="7" r="2.6"/><circle cx="7" cy="17" r="2.6"/><circle cx="17" cy="17" r="2.6"/></svg>
      </button>
    </header>

    <div class="pane__body" id="mainBody"></div>

    <!-- Composer. Model routing lives here — next to the message it affects. -->
    <div class="composer-wrap" id="composerWrap">
      <form class="composer" id="composer">
        <!-- Anchored to the composer, not the viewport, so it opens where the
             button that summoned it is. -->
        <div class="pop" id="assistPop" data-open="false" role="menu"></div>
        <div class="composer__chips" id="composerChips"></div>
        <textarea class="composer__input" id="composerInput" rows="1"
                  placeholder="Ask anything, or describe a task…"></textarea>
        <div class="composer__bar">
          <button type="button" class="btn btn--ghost btn--sm" id="attachBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5 12.4 19a5 5 0 0 1-7-7l7.6-7.6a3.3 3.3 0 0 1 4.7 4.7l-7.6 7.6a1.7 1.7 0 0 1-2.4-2.4l7-7"/></svg>
            Attach
          </button>
          <!-- Favourited assistants are chosen from here, so one can be bound
               to a message without leaving the thread. -->
          <button type="button" class="btn btn--ghost btn--sm" id="assistBtn" aria-haspopup="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="12" rx="2.5"/><path d="M12 3v4M8.5 12v1.5M15.5 12v1.5"/></svg>
            Assistants <span style="color:var(--text-4)" id="assistCount"></span>
          </button>
          <span class="composer__divider"></span>
          <button type="button" class="composer__model" id="modelBtn">
            <span id="modelLabel">ChatGPT 5</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-4)"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="composer__spacer"></div>
          <button type="submit" class="btn btn--primary" id="sendBtn" disabled>
            Send <span class="kbd">⌘↵</span>
          </button>
        </div>
      </form>
      <p class="composer__hint">Responses are simulated locally. Nothing leaves this page.</p>
    </div>
  </section>

  <!-- =================================================== results column
       Where the workspace's outcomes are kept — every thread's, newest first,
       grouped by day. Its resting state is that list; a detail is one click
       away, and the back button returns to the list. The column opens itself
       when a result appears and stays shut while there are none. A turn that
       produces a definite artifact also leaves a one-line reference card in
       the thread it came from.
  -->
  <section class="pane artpane" id="artpane" aria-label="Results">
    <div class="artpane__grip" id="artGrip" role="separator" aria-orientation="vertical" tabindex="0"
         aria-label="Resize results column"></div>
    <header class="artpane__head">
      <!-- Shown only while a result is open: the pane's resting state is the
           list, so leaving a detail has to be one click. -->
      <button class="iconbtn iconbtn--sm" id="artBack" title="All results" aria-label="Back to results" hidden>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
      </button>
      <span class="artpane__ico" id="artIcon"></span>
      <span class="artpane__title" id="artTitle">Results</span>
      <div class="seg" id="artTabs"></div>
      <!-- A result is only useful if it can leave. Both act on the result being
           read, so both are hidden while the pane is showing the list. -->
      <button class="iconbtn iconbtn--sm" id="artDl" title="Download" aria-label="Download result" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7.5 11 4.5 4.5L16.5 11"/><path d="M5 20h14"/></svg>
      </button>
      <button class="iconbtn iconbtn--sm" id="artShare" title="Share…" aria-label="Share result" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7.5 8.5 4.5-4.5 4.5 4.5"/><path d="M5 13v5.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V13"/></svg>
      </button>
      <button class="iconbtn iconbtn--sm" id="artClose" title="Close results column (⌘.)" aria-label="Close results column">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div class="artpane__body" id="artBody"></div>
    <footer class="artpane__foot" id="artFoot"></footer>
  </section>

  <!-- ========================================================= app panel
       An app is a surface, not a destination — but it is not an overlay
       either. This is a column of the shell: opening one takes width from
       the conversation instead of covering it, so both stay readable and
       nothing has to be dismissed before the page can be used again. Zero
       width when closed. The rail beside it stays live, so one app can be
       swapped for another without going anywhere.
  -->
  <aside class="appsheet" id="appSheet" data-open="false" aria-label="App" aria-hidden="true">
    <header class="appsheet__head">
      <span class="apptile" id="appSheetTile" aria-hidden="true"></span>
      <span class="appsheet__id">
        <span class="appsheet__name" id="appSheetName"></span>
        <span class="appsheet__sub" id="appSheetSub"></span>
      </span>
      <span id="appSheetState"></span>
      <button class="iconbtn iconbtn--sm" id="appSheetClose" title="Close (esc)" aria-label="Close app">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div class="appsheet__body" id="appSheetBody"></div>
    <footer class="appsheet__foot" id="appSheetFoot"></footer>
  </aside>

  <!-- ========================================================== app rail
       Always on screen: it is the only way in to the apps, and a launcher you
       have to summon is one nobody uses. The chevron widens it to show names
       rather than opening a screen of its own.
  -->
  <nav class="apprail" id="apprail" aria-label="Apps">
    <div class="apprail__head">
      <span class="apprail__label t-eyebrow">Apps</span>
    </div>
    <div class="apprail__body" id="appsBody"></div>
    <button class="apprail__more" id="appsMore" aria-label="Show app names">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
  </nav>

  <!-- Usage spans every column, because it belongs to none of them. -->
  <footer class="statusbar">
    <span class="statusbar__item"><span class="dot dot--ok" id="stDot"></span><span id="stState">ready</span></span>
    <!-- The platform, not the routed model — that lives in the composer. -->
    <span class="statusbar__item statusbar__hide-sm" id="stModel">Nebulas Pro</span>
    <div class="statusbar__spacer"></div>
    <span class="statusbar__item statusbar__hide-sm">
      <span id="stTokens">0 / 200k</span>
      <span class="meter statusbar__meter"><i id="stBar" style="width:0%"></i></span>
    </span>
    <span class="statusbar__item statusbar__hide-sm" id="stCost">$0.000</span>
    <button class="statusbar__item" id="stThemeBtn" title="Toggle theme (⌘J)">
      <span id="stTheme">Light</span>
    </button>
    <button class="statusbar__item" id="stDensityBtn" title="Cycle interface density">
      <span id="stDensity">Comfortable</span>
    </button>
  </footer>
</div>

<!-- ======================================================= command palette -->
<div class="scrim" id="scrim" data-open="false">
  <div class="palette" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="palette__input">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-4)" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="palInput" placeholder="Search threads, apps, knowledge and commands…" autocomplete="off" spellcheck="false">
    </div>
    <div class="palette__list" id="palList"></div>
    <div class="palette__foot">
      <span><span class="kbd">↑↓</span> navigate</span>
      <span><span class="kbd">↵</span> open</span>
      <span><span class="kbd">esc</span> close</span>
    </div>
  </div>
</div>

<!-- ==================================================== assistant, in detail
     Opened from an assistant card in Chat. An overlay rather than a page: you
     came here from a list to decide whether this is the one you want, and
     picking it should put you back where you were with it bound — see
     useExample in app.js. Everything in it is rendered by app.js.
-->
<div class="scrim scrim--center" id="asstScrim" data-open="false">
  <div class="detail" role="dialog" aria-modal="true" aria-labelledby="asstName">

    <aside class="detail__id">
      <div class="detail__idhead">
        <span class="detail__glyph" id="asstGlyph" aria-hidden="true"></span>
        <div class="detail__names">
          <h2 class="detail__name" id="asstName">Assistant</h2>
          <!-- Both ids are copyable, because an id you cannot copy is decoration -->
          <button class="detail__uuid" id="asstEndpoint" type="button"></button>
        </div>
      </div>
      <button class="detail__rec" id="asstRecord" type="button"></button>
      <p class="detail__desc" id="asstDesc"></p>
      <div class="detail__ex" id="asstEx"></div>
      <div class="detail__meta" id="asstMeta"></div>
      <div class="detail__upd" id="asstUpd"></div>
    </aside>

    <div class="detail__main">
      <header class="detail__head">
        <div class="tabs detail__tabs" id="asstTabs" role="tablist"></div>
        <button class="iconbtn iconbtn--sm" id="asstClose" title="Close (esc)" aria-label="Close">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div class="detail__body" id="asstBody"></div>
    </div>
  </div>
</div>

<!-- ========================================================= share a result
     A link with no access control is not a share, it is a leak — so the dialog
     asks who may open it first and only then mints one. Nothing is uploaded:
     the URL is generated in the page and goes nowhere.
-->
<div class="scrim" id="shareScrim" data-open="false">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
    <header class="dialog__head">
      <span class="dialog__ico" id="shareIco" aria-hidden="true"></span>
      <span class="dialog__id">
        <span class="dialog__title" id="shareTitle">Share result</span>
        <span class="dialog__sub" id="shareSub"></span>
      </span>
      <button class="iconbtn iconbtn--sm" id="shareClose" title="Close (esc)" aria-label="Close">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div class="dialog__body" id="shareBody"></div>
    <footer class="dialog__foot" id="shareFoot"></footer>
  </div>
</div>

<!-- ======================================================= make a project
     The same dialog creates one and edits one, because the answers are the
     same answers and none of them is final. Only the name is required: leave
     the rest and the project is a folder; switch on a schedule and it becomes
     something that produces a result on its own. Rendered by renderProject.

     The two list-shaped settings are folded shut, so the form is a screen
     rather than a scroll. `projHelp` toggles the per-setting instructions,
     which retire by themselves once the dialog has been used once.
-->
<div class="scrim" id="projScrim" data-open="false">
  <div class="dialog dialog--wide" role="dialog" aria-modal="true" aria-labelledby="projTitle">
    <header class="dialog__head">
      <span class="dialog__ico" id="projIco" aria-hidden="true"></span>
      <span class="dialog__id">
        <span class="dialog__title" id="projTitle">New project</span>
        <span class="dialog__sub" id="projSub"></span>
      </span>
      <button class="iconbtn iconbtn--sm" id="projHelp" title="Show what each setting does" aria-label="Show what each setting does" aria-pressed="false">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .9-1 1.6v.4"/><path d="M12 17h.01"/></svg>
      </button>
      <button class="iconbtn iconbtn--sm" id="projClose" title="Close (esc)" aria-label="Close">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div class="dialog__body" id="projBody"></div>
    <footer class="dialog__foot" id="projFoot"></footer>
  </div>
</div>

<!-- ===================================================== a post, before it goes
     A queued post is the one thing on a publishing project that is edited
     rather than asked for, so it gets the dialog the project settings get —
     the text, the channel it is written for, when it leaves, and the one
     button that lets it. Its own overlay rather than a second use of the
     project dialog: two dialogs sharing a shell share its state too. -->
<div class="scrim" id="postScrim" data-open="false">
  <div class="dialog dialog--wide" role="dialog" aria-modal="true" aria-labelledby="postTitle">
    <header class="dialog__head">
      <span class="dialog__ico" id="postIco" aria-hidden="true"></span>
      <span class="dialog__id">
        <span class="dialog__title" id="postTitle">Post</span>
        <span class="dialog__sub" id="postSub"></span>
      </span>
      <button class="iconbtn iconbtn--sm" id="postClose" title="Close (esc)" aria-label="Close">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div class="dialog__body" id="postBody"></div>
    <footer class="dialog__foot" id="postFoot"></footer>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
